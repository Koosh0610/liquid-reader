name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew --no-daemon test assembleDebug

      - run: cp app/build/outputs/apk/debug/app-debug.apk LiquidReader-${GITHUB_REF_NAME//\//-}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: LiquidReader-apk
          path: LiquidReader-*.apk

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: LiquidReader-*.apk
